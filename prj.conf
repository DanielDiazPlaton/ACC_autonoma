CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_THREAD_NAME=y

# Salida de consola (necesario para ver los printk de los threads)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y

# Pila CAN e ISO-TP
CONFIG_CAN=y
CONFIG_ISOTP=y

# Pools de memoria para evitar agotamiento de buffers en TX/RX simultáneo
CONFIG_ISOTP_RX_SF_FF_BUF_COUNT=2
CONFIG_ISOTP_RX_BUF_COUNT=4
CONFIG_ISOTP_RX_BUF_SIZE=64
CONFIG_ISOTP_TX_BUF_COUNT=4